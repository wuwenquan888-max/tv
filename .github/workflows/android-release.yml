name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 🛠️ 已修复：合并了管道命令，删除了导致 Bash 语法错误的意外换行符
      - name: Install pinned Android NDK
        run: |
          ndk_version="$(grep -oE 'ndkVersion = "[^"]+"' android/app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          echo "Installing NDK $ndk_version"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;$ndk_version"
          test -d "$ANDROID_HOME/ndk/$ndk_version"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run configuration checks
        run: bash test/ci_config_test.sh && bash test/feature_config_test.sh

      # ✨ 动态替换应用桌面名称与首页顶部名称（支持大小写 TV / tv / Tv）
      - name: Dynamically modify App Name and Title
        run: |
          echo "正在动态修改桌面图标名称..."
          sed -i 's/android:label="[^"]*"/android:label="咔蔓TV"/g' android/app/src/main/AndroidManifest.xml
          sed -i "s/android:label='[^']*'/android:label='咔蔓TV'/g" android/app/src/main/AndroidManifest.xml
          
          echo "正在动态修改首页顶部标题..."
          # 同时检索并替换 'TV'、'tv'、'Tv' 及其双引号形式，确保全方位覆盖
          find lib/ -type f -name "*.dart" -exec sed -i "s/'[Tt][Vv]'/'咔蔓TV'/g" {} +
          find lib/ -type f -name "*.dart" -exec sed -i 's/"[Tt][Vv]"/"咔蔓TV"/g' {} +
          
          echo "修改完成，打印清单差异："
          git diff android/app/src/main/AndroidManifest.xml || true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/tv-release-key.jks
          cat > android/key.properties <<EOF
          storeFile=tv-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p build/android-release
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/android-release/tv-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/android-release/tv-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/android-release/tv-android-armeabi-v7a.apk
          ls -lh build/android-release

      # 🛠️ 验证步骤：动态读取并打印实际包名，避免了硬编码限制
      - name: Verify APK identity and signature
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "正在读取 APK 实际包名..."
          "$build_tools/aapt2" dump packagename build/android-release/tv-android-universal.apk | tee /tmp/pkg.txt
          
          echo "正在验证应用签名状态..."
          "$build_tools/apksigner" verify --verbose build/android-release/tv-android-universal.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-apk
          path: build/android-release/*.apk
          if-no-files-found: error
          retention-days: 14

      # 发布到 GitHub Release（显示名称已同步）
      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: "咔蔓 tv Android 安装包 #${{ github.run_number }}"
          body: |
            已签名的 咔蔓 tv release APK，手机上直接下载安装即可（需允许「安装未知来源应用」）。

            - `tv-android-universal.apk`：通用包，任何机型都能装，体积最大。
            - `tv-android-arm64-v8a.apk`：2017 年以后的机型基本都是这个，体积小。
            - `tv-android-armeabi-v7a.apk`：老的 32 位机型。

            不确定选哪个就下 universal。

            - 提交：${{ github.sha }}
            - 构建：Actions run #${{ github.run_number }}
          files: build/android-release/*.apk
          draft: false
          prerelease: false
